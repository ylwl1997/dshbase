<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <rect width="960" height="360" fill="#ffffff"/>
  <defs>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dc2626"/><stop offset="1" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b6ef5"/><stop offset="1" stop-color="#2456d6"/>
    </linearGradient>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 z" fill="#94a3b8"/></marker>
  </defs>
  <text x="24" y="34" font-size="19" font-weight="700" fill="#0f172a">dsh2shell — unauthenticated RCE on web-exposed DSH (CVSS 9.8)</text>
  <text x="24" y="56" font-size="12.5" fill="#64748b">Host-header check is the only gate: spoof it, and the management RPC accepts you as localhost.</text>

  <!-- Attacker -->
  <rect x="40" y="90" width="180" height="70" rx="10" fill="#fef2f2" stroke="#dc2626"/>
  <text x="130" y="118" font-size="14" font-weight="700" fill="#7f1d1d" text-anchor="middle">Attacker</text>
  <text x="130" y="138" font-size="11" fill="#991b1b" text-anchor="middle">no API key, no login</text>

  <!-- Fake LLM -->
  <rect x="40" y="250" width="180" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="5"/>
  <text x="130" y="278" font-size="14" font-weight="700" fill="#7f1d1d" text-anchor="middle">Fake LLM server</text>
  <text x="130" y="298" font-size="11" fill="#991b1b" text-anchor="middle">returns tool-call payloads</text>

  <!-- DSH host -->
  <rect x="420" y="90" width="230" height="230" rx="12" fill="url(#blue)"/>
  <text x="535" y="122" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">DSH web instance</text>
  <text x="535" y="142" font-size="11" fill="#dbeafe" text-anchor="middle">exposed on the public network</text>
  <rect x="442" y="156" width="186" height="34" rx="6" fill="#ffffff" opacity="0.92"/>
  <text x="535" y="178" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">① spoofed Host: localhost</text>
  <rect x="442" y="198" width="186" height="34" rx="6" fill="#ffffff" opacity="0.92"/>
  <text x="535" y="220" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">② privileged RPC unlocked</text>
  <rect x="442" y="240" width="186" height="34" rx="6" fill="#ffffff" opacity="0.92"/>
  <text x="535" y="262" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">③ register provider + switch</text>
  <rect x="442" y="282" width="186" height="34" rx="6" fill="#ffffff" opacity="0.92"/>
  <text x="535" y="304" font-size="12" font-weight="700" fill="#1e293b" text-anchor="middle">④ session.prompt → bash tool</text>

  <!-- box -->
  <rect x="730" y="90" width="190" height="70" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="825" y="118" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">Arbitrary shell cmd</text>
  <text x="825" y="138" font-size="11" fill="#64748b" text-anchor="middle">full host takeover</text>

  <rect x="730" y="190" width="190" height="70" rx="10" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="825" y="218" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">API keys leaked</text>
  <text x="825" y="238" font-size="11" fill="#64748b" text-anchor="middle">.env / .credentials.yaml</text>

  <!-- arrows -->
  <line x1="220" y1="125" x2="420" y2="125" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="420" y1="285" x2="220" y2="285" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="650" y1="110" x2="730" y2="110" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="650" y1="210" x2="730" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="130" y1="160" x2="130" y2="250" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr)"/>
</svg>