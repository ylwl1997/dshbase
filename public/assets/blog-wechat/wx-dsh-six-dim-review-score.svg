<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
  <rect width="960" height="420" fill="#ffffff"/>
  <defs>
    <linearGradient id="good" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b6ef5"/><stop offset="1" stop-color="#2456d6"/></linearGradient>
    <linearGradient id="bad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#dc2626"/><stop offset="1" stop-color="#b91c1c"/></linearGradient>
