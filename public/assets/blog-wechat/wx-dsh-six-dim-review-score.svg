    <text x="906" y="135" font-weight="700" fill="#0f172a" text-anchor="end">9/10</text>

    <text x="24" y="170" fill="#334155">Observability (Trajectory)</text>
    <rect x="260" y="156" width="630" height="16" rx="8" fill="#f1f5f9"/>
    <rect x="260" y="156" width="567" height="16" rx="8" fill="url(#good)"/>
    <text x="906" y="170" font-weight="700" fill="#0f172a" text-anchor="end">9/10</text>

