    <rect x="260" y="226" width="441" height="16" rx="8" fill="url(#mid)"/>
    <text x="906" y="240" font-weight="700" fill="#0f172a" text-anchor="end">7/10</text>

    <text x="24" y="275" fill="#334155">Docs &amp; onboarding</text>
    <rect x="260" y="261" width="630" height="16" rx="8" fill="#f1f5f9"/>
    <rect x="260" y="261" width="441" height="16" rx="8" fill="url(#mid)"/>
