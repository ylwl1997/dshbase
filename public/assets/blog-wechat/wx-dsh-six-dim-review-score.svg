  <text x="24" y="34" font-size="19" font-weight="700" fill="#0f172a">DeepSeek Harness — six-dimension scorecard (overall 6.5/10)</text>
  <text x="24" y="56" font-size="12.5" fill="#64748b">Real-machine review of dsh 0.1.0-rc.6: architecture and observability shine, plugin security drags it down.</text>

  <!-- score rows -->
  <g font-size="13">
    <text x="24" y="100" fill="#334155">Architecture concept</text>
