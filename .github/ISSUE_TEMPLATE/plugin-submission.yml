---
name: 插件收录提交 / Plugin submission
description: 提交一个 DeepSeek Harness 插件到 dshbase 插件目录
title: "[收录] 插件名称"
labels: ["plugin-submission"]
body:
  - type: input
    id: name
    attributes:
      label: 插件名称
      description: 插件的 npm 包名或仓库名
      placeholder: dsh-xxx
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: GitHub 仓库
      description: 仓库完整地址
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: input
    id: npm
    attributes:
      label: npm 包名（可选）
      description: 如果发布到了 npm，填包名（含 scope）
      placeholder: "@owner/pkg"
  - type: textarea
    id: desc
    attributes:
      label: 功能描述
      description: 一句话说明这个插件做什么、解决什么问题
      placeholder: 一句话功能描述
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 分类
      options:
        - Developer（开发）
        - AI Models（AI 模型）
        - UI & Skins（界面与皮肤）
        - Knowledge（知识）
        - Desktop（桌面端）
        - Automation（自动化）
        - Network（网络）
        - Browser（浏览器）
        - Terminal（终端）
        - Storage（存储）
        - Vision（视觉 / OCR）
        - Data（数据）
        - Security（安全）
        - Productivity（效率）
        - Content（内容）
    validations:
      required: true
  - type: checkboxes
    id: checklist
    attributes:
      label: 确认
      options:
        - label: 仓库已加 dsh-plugin topic
        - label: 插件带 dsh.bundle 清单（cordis.patch.yml）
        - label: 仓库有 LICENSE 许可
