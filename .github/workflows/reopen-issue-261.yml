name: Reopen typo-check submission

# One-shot. A merge note used a GitHub closing keyword beside issue 261, so
# that submission was marked completed. This workflow sets it back to open
# and does not add a comment. It does not touch 267–270, 250, 205, or 207.
# Safe to delete after it succeeds.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/reopen-issue-261.yml

permissions:
  issues: write

jobs:
  reopen:
    runs-on: ubuntu-latest
    steps:
      - name: Reopen issue 261
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = 261;
            const issue = await github.rest.issues.get({ owner, repo, issue_number });
            if (issue.data.state !== "open") {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                state: "open",
              });
              core.info("reopened 261");
            } else {
              core.info("261 already open");
            }
