name: Daily sync from GitHub dsh-plugin topic

on:
  schedule:
    - cron: '17 4 * * *'  # 每天 04:17 UTC（错峰）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run topic sync
        run: |
          python scripts/sync-topic.py
          python scripts/gen-repos.py
          python scripts/gen-sitemap.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/plugins.json src/data/sync-date.json functions/api/repos.js public/sitemap.xml
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: daily sync ($(date -u +%Y-%m-%d))"
            git push
          fi
