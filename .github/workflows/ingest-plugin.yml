name: Ingest plugin submission

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    if: startsWith(github.event.issue.title, '[收录]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Process issue (verify + ingest + reply)
        run: python scripts/process-issue.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}

      - name: Commit if accepted
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/plugins.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "feat(plugins): ingest from issue #${{ github.event.issue.number }}"
            git push
          fi
