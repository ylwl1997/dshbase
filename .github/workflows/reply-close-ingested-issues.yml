name: Reply and close ingested plugin issues

# One-shot: the cloud agent token cannot write issues. This workflow uses the
# repo GITHUB_TOKEN (issues: write) to post catalog close-outs for #262 and
# #263, and a short topic request on #261 (left open). Safe to delete after it
# succeeds. It does not touch #250, #205, or #207.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/reply-close-ingested-issues.yml

permissions:
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close #262 and #263; ask #261 for the topic
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const closeOut = {
              262: [
                "感谢提交！**dsh-memory-sync** 已经收录进目录了：https://dshbase.com/plugins/dsh-memory-sync/",
                "",
                "每次打开 DeepSeek Harness 就自动把本机的 git 记忆目录和对端双向同步一次，不用常驻后台，也不用 cron，这个想法太适合自动化分类了。完整的对端同步需要一台可 SSH 的机器和 git 远端，目录页上已经写清楚。感谢分享给社区 🙌",
              ].join("\n"),
              263: [
                "感谢更新！**dsh-mnemos-continuity** 已经升到 **1.7.1**：https://dshbase.com/plugins/dsh-mnemos-continuity/",
                "",
                "空闲学习和那条第三方 API 路由的说明已经按新 README 从目录里拿掉了，还是原来的 slug，没有重复收录。感谢你一直打磨并分享给社区 🙌",
              ].join("\n"),
            };
            const askTopic = [
              "感谢提交 **dsh-zh-typo-check**！仓库目前还没有 `dsh-plugin` 这个 topic，所以这次先不收录。",
              "",
              "请在 https://github.com/songshuhuoban/dsh-zh-typo-check 的 Topics 里加上 `dsh-plugin`，加好后回复这条 issue，我们再继续。",
            ].join("\n");

            async function ensureComment(issue_number, body, marker) {
              const existing = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
              const already = existing.data.some((c) => (c.body || "").includes(marker));
              if (!already) {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
                core.info(`commented #${issue_number}`);
              } else {
                core.info(`#${issue_number} already has the catalog note`);
              }
            }

            for (const [num, body] of Object.entries(closeOut)) {
              const issue_number = Number(num);
              const marker = body.match(/https:\/\/dshbase\.com\/plugins\/[^/\s]+\/?/)[0];
              await ensureComment(issue_number, body, marker);
              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                state: "closed",
                state_reason: "completed",
              });
              core.info(`closed #${issue_number}`);
            }

            await ensureComment(261, askTopic, "dsh-plugin");
            core.info("left #261 open");
