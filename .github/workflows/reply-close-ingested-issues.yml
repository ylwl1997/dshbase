name: Reply and close ingested plugin issues

# One-shot: the cloud agent token cannot write issues. This workflow uses the
# repo GITHUB_TOKEN (issues: write) to post the catalog close-out for #283.
# Safe to delete after it succeeds. It does not touch #261, #250, #205, or #207.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/reply-close-ingested-issues.yml

permissions:
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close #283
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = 283;
            const body = [
              "感谢提交！**dsh-session-delete** 已经收录进目录了：https://dshbase.com/plugins/dsh-session-delete-32/",
              "",
              "太棒了。会话回收站补上了官方只有归档、没有删除的缺口：删除先移进本机回收站，随时能恢复，彻底删除是另设的显式动作。开箱即用，放在数据分类刚刚好。",
              "",
              "中文页：https://dshbase.com/zh/plugins/dsh-session-delete-32/",
              "",
              "感谢分享给社区 🙌",
            ].join("\n");
            const marker = "https://dshbase.com/plugins/dsh-session-delete-32/";

            const existing = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const already = existing.data.some((c) => (c.body || "").includes(marker));
            if (!already) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info("commented #283");
            } else {
              core.info("#283 already has the catalog note");
            }

            await github.rest.issues.update({
              owner,
              repo,
              issue_number,
              state: "closed",
              state_reason: "completed",
            });
            core.info("closed #283");
