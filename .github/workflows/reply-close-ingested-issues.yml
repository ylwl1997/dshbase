name: Reply and close ingested plugin issues

# One-shot: the cloud agent token cannot write issues. This workflow uses the
# repo GITHUB_TOKEN (issues: write) to post the catalog close-out and close
# Issues #206, #208, #209, and #210. Safe to delete after it succeeds.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/reply-close-ingested-issues.yml

permissions:
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close #206, #208, #209, and #210
        uses: actions/github-script@v7
        with:
          script: |
            const comments = {
              206: [
                "Thanks for shipping **dsh-trust-center** — it’s live on dshbase 🎉",
                "",
                "Directory: https://dshbase.com/plugins/dsh-trust-center/",
                "中文：https://dshbase.com/zh/plugins/dsh-trust-center/",
                "",
                "只读信任审计：MCP 工具描述和 Skills 里的提示注入、隐藏 Unicode、危险命令、凭据访问和上下文成本，侧栏就能打开信任中心，开箱即用，收录啦。Closing this Issue — 感谢 @H3OOCH 投稿！",
              ].join("\n"),
              208: [
                "Thanks for shipping **dsh-session-accordion** — it’s live on dshbase 🎉",
                "",
                "Directory: https://dshbase.com/plugins/dsh-session-accordion/",
                "中文：https://dshbase.com/zh/plugins/dsh-session-accordion/",
                "",
                "会话交互折叠：每一轮压成一行（时间胶囊 + 提问摘要），只留最近一次展开，切换会话也会回到最新一条，开箱即用，收录啦。Closing this Issue — 感谢 @ayuanxx-max 投稿！",
              ].join("\n"),
              209: [
                "Thanks for shipping **DeepSeek-Usage** — it’s live on dshbase 🎉",
                "",
                "Directory: https://dshbase.com/plugins/DeepSeek-Usage/",
                "中文：https://dshbase.com/zh/plugins/DeepSeek-Usage/",
                "",
                "DeepSeek 用量面板：官方余额和每日账单、5 级用量日历，还能按可编辑的逐模型费率估算本地会话日志，收录啦。Closing this Issue — 感谢 @sdiwenchen-lang 投稿！",
              ].join("\n"),
              210: [
                "Thanks for shipping **dsh-session-fork-tree** — it’s live on dshbase 🎉",
                "",
                "Directory: https://dshbase.com/plugins/dsh-session-fork-tree/",
                "中文：https://dshbase.com/zh/plugins/dsh-session-fork-tree/",
                "",
                "侧栏分叉树：子会话缩进挂在父会话下面，圆角连接线、绿色 + 逐层展开，悬停时祖先链高亮，开箱即用，收录啦。目录记的是当前 release v0.8.0。Closing this Issue — 感谢 @ayuanxx-max 投稿！",
              ].join("\n"),
            };
            const { owner, repo } = context.repo;
            for (const [num, body] of Object.entries(comments)) {
              const issue_number = Number(num);
              const existing = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
              const already = existing.data.some((c) =>
                (c.body || "").includes("https://dshbase.com/plugins/") &&
                (c.body || "").includes("Closing this Issue")
              );
              if (!already) {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              } else {
                core.info(`#${issue_number} already has the close-out comment`);
              }
              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                state: "closed",
                state_reason: "completed",
              });
              core.info(`closed #${issue_number}`);
            }
