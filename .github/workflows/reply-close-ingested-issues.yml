name: Reply and close ingested plugin issues

# One-shot: the cloud agent token cannot write issues. This workflow uses the
# repo GITHUB_TOKEN (issues: write) to post the catalog close-out for
# #292, #293, and #250. Safe to delete after it succeeds.
# It does not touch #261, #207, or #205.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/reply-close-ingested-issues.yml

permissions:
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close ingested issues
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const items = [
              {
                issue_number: 292,
                marker: "https://dshbase.com/plugins/yumiku-dsh-commandcode-quota/",
                body: [
                  "感谢提交！**dsh-commandcode-quota** 已经收录进目录了：https://dshbase.com/plugins/yumiku-dsh-commandcode-quota/",
                  "",
                  "太棒了。设置页和可拖动的浮窗胶囊里就能看到 Command Code 的套餐额度、5 小时 / 每周窗口、本期请求和套餐档位，API key 也可以在设置里管理。完整显示额度需要你自己的 Command Code 账号和 API key，目录页上已经写清楚。放在效率分类刚刚好。",
                  "",
                  "安装：`dsh plugin add @yumiku/dsh-commandcode-quota`（目录版本 1.0.2）。",
                  "",
                  "中文页：https://dshbase.com/zh/plugins/yumiku-dsh-commandcode-quota/",
                  "",
                  "感谢分享给社区 🙌",
                ].join("\n"),
              },
              {
                issue_number: 293,
                marker: "https://dshbase.com/plugins/dsh-tv/",
                body: [
                  "感谢提交！**dsh-tv** 已经收录进目录了：https://dshbase.com/plugins/dsh-tv/",
                  "",
                  "太棒了。右侧边栏一个图标就能切抖音、短剧、YouTube、B站、Instagram、HackerTube，还带随机全球频道，播放前会先校验。桌面端用 Electron webview 加载。放在内容分类刚刚好。",
                  "",
                  "安装：`dsh plugin --profile desktop add github:MathewWuZJ/dsh-tv`（目录版本 0.1.0）。",
                  "",
                  "中文页：https://dshbase.com/zh/plugins/dsh-tv/",
                  "",
                  "感谢分享给社区 🙌",
                ].join("\n"),
              },
              {
                issue_number: 250,
                marker: "https://dshbase.com/plugins/dsh-workflow-kit/",
                body: [
                  "感谢提交！**dsh-workflow-kit** 已经收录进目录了：https://dshbase.com/plugins/dsh-workflow-kit/",
                  "",
                  "谢谢你补上 `cordis.patch.yml`。现在六个工具 `workflow_list` / `workflow_take` / `workflow_report` / `workflow_submit` / `workflow_accept` / `workflow_block` 都能装进宿主：信箱、工单、自动接单、失败留证和定时巡检都在。放在自动化分类刚刚好。",
                  "",
                  "安装：`dsh plugin add github:stayw1thme999/dsh-workflow-kit`（目录版本 0.2.0）。",
                  "",
                  "中文页：https://dshbase.com/zh/plugins/dsh-workflow-kit/",
                  "",
                  "感谢分享给社区 🙌",
                ].join("\n"),
              },
            ];

            for (const item of items) {
              const existing = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: item.issue_number,
                per_page: 100,
              });
              const already = existing.data.some((c) => (c.body || "").includes(item.marker));
              if (!already) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: item.issue_number,
                  body: item.body,
                });
                core.info(`commented #${item.issue_number}`);
              } else {
                core.info(`#${item.issue_number} already has the catalog note`);
              }

              await github.rest.issues.update({
                owner,
                repo,
                issue_number: item.issue_number,
                state: "closed",
                state_reason: "completed",
              });
              core.info(`closed #${item.issue_number}`);
            }
