name: Reply and close ingested plugin issues

# One-shot: the cloud agent token cannot write issues. This workflow uses the
# repo GITHUB_TOKEN (issues: write) to post the catalog close-out for #279.
# Safe to delete after it succeeds. It does not touch #261, #250, #205, or #207.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/reply-close-ingested-issues.yml

permissions:
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close #279
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = 279;
            const body = [
              "感谢提交！**dsh-time-pin** 已经收录进目录了：https://dshbase.com/plugins/dsh-time-pin/",
              "",
              "太棒了。给每个对话钉住 as_of 时间点和前后回看范围，受限模式下只认窗口里带日期的证据，首条回复还会把时间窗复述一遍；后台任务闷太久，也会收到确定性的 `[TIME FACT]`。默认模式不注入、不过滤，开箱即用，放在效率分类刚刚好。",
              "",
              "中文页：https://dshbase.com/zh/plugins/dsh-time-pin/",
              "",
              "感谢分享给社区 🙌",
            ].join("\n");
            const marker = "https://dshbase.com/plugins/dsh-time-pin/";

            const existing = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const already = existing.data.some((c) => (c.body || "").includes(marker));
            if (!already) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info("commented #279");
            } else {
              core.info("#279 already has the catalog note");
            }

            await github.rest.issues.update({
              owner,
              repo,
              issue_number,
              state: "closed",
              state_reason: "completed",
            });
            core.info("closed #279");
