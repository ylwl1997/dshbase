name: Reply and close ingested plugin issues

# One-shot: the cloud agent token cannot write issues. This workflow uses the
# repo GITHUB_TOKEN (issues: write) to post the catalog close-out for #307.
# Safe to delete after it succeeds.
# It does not touch #261, #207, or #205.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/reply-close-ingested-issues.yml

permissions:
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close ingested issues
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const items = [
              {
                issue_number: 307,
                marker: "https://dshbase.com/plugins/dsh-memory-scaffold/",
                body: [
                  "感谢提交！**dsh-memory-scaffold** 已经收录进目录了：https://dshbase.com/plugins/dsh-memory-scaffold/",
                  "",
                  "谢谢你把长期自我做成一套能搬走的结构：分层记忆文件、判断卡、完整/紧凑接续包（8 个验证问题），还有可迁移性 × 可接续性两问尺子。纯 markdown/JSON，零依赖、不联网、不调用模型。放在知识分类刚刚好。",
                  "",
                  "目录显示名是 `dsh-memory-scaffold`，bundle 行 id 仍是 `dsh-self`，CLI 还是 `dsh-self`。当前是已收录（Listed），这次没有做安装实测，所以还不是 Verified。",
                  "",
                  "安装：`dsh plugin --profile web add github:malabananclauss-rgb/dsh-memory-scaffold#v0.2.0`（目录版本 0.2.0）。npm 还没发布；请不要安装 npm 上那个无关的 `dsh-self`。",
                  "",
                  "中文页：https://dshbase.com/zh/plugins/dsh-memory-scaffold/",
                  "",
                  "感谢分享给社区 🙌",
                ].join("\n"),
              },
            ];

            for (const item of items) {
              const existing = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: item.issue_number,
                per_page: 100,
              });
              const already = existing.data.some((c) => (c.body || "").includes(item.marker));
              if (!already) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: item.issue_number,
                  body: item.body,
                });
                core.info(`commented #${item.issue_number}`);
              } else {
                core.info(`#${item.issue_number} already has the catalog note`);
              }

              await github.rest.issues.update({
                owner,
                repo,
                issue_number: item.issue_number,
                state: "closed",
                state_reason: "completed",
              });
              core.info(`closed #${item.issue_number}`);
            }
