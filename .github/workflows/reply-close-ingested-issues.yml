name: Reply and close ingested plugin issues

# One-shot: the cloud agent token cannot write issues. This workflow uses the
# repo GITHUB_TOKEN (issues: write) to post catalog close-outs for #237, #251,
# #252, and #253. Safe to delete after it succeeds. It does not touch other issues.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/reply-close-ingested-issues.yml

permissions:
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close #237, #251, #252, and #253
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const closeOut = {
              237: [
                "感谢提交！**wecom-dsh-plugins** 已收录到目录：https://dshbase.com/plugins/wecom-dsh-plugins/",
                "",
                "企业微信微盘选择器能把选中的文件写成官方 @ 引用，并优先走本机 wecom-cli，这个方向很适合效率分类。感谢分享给社区 🙌",
              ].join("\n"),
              251: [
                "感谢提交！**dsh-plugin-favorites** 已收录到目录：https://dshbase.com/plugins/dsh-plugin-favorites/",
                "",
                "右侧栏收藏网址、分类折叠、拖拽归类，是很实用的界面增强。感谢分享给社区 🙌",
              ].join("\n"),
              252: [
                "感谢提交！**dsh-balance-ball** 已收录到目录：https://dshbase.com/plugins/dsh-balance-ball/",
                "",
                "悬浮球显示 OAuth 账户余额，并带上实时价格和今日走势，放在界面分类很合适。感谢分享给社区 🙌",
              ].join("\n"),
              253: [
                "感谢提交！**@hiai-gg/dsh-docsmint** 已收录到目录：https://dshbase.com/plugins/dsh-docsmint/",
                "",
                "DocsMint 工作区面板加上搜索、读取、创建、更新四个工具，很适合知识分类。感谢分享给社区 🙌",
              ].join("\n"),
            };

            async function ensureComment(issue_number, body, marker) {
              const existing = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number,
                per_page: 100,
              });
              const already = existing.data.some((c) => (c.body || "").includes(marker));
              if (!already) {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
                core.info(`commented #${issue_number}`);
              } else {
                core.info(`#${issue_number} already has the catalog note`);
              }
            }

            for (const [num, body] of Object.entries(closeOut)) {
              const issue_number = Number(num);
              const marker = body.match(/https:\/\/dshbase\.com\/plugins\/[^/\s]+\/?/)[0];
              await ensureComment(issue_number, body, marker);
              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                state: "closed",
                state_reason: "completed",
              });
              core.info(`closed #${issue_number}`);
            }
