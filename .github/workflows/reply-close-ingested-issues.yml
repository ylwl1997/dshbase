name: Reply and close ingested plugin issues

# One-shot: the cloud agent token cannot write issues. This workflow uses the
# repo GITHUB_TOKEN (issues: write) to post the catalog close-out for #275.
# Safe to delete after it succeeds. It does not touch #261, #250, #205, or #207.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/reply-close-ingested-issues.yml

permissions:
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close #275
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = 275;
            const body = [
              "感谢提交！**dsh-content-search** 已经收录进目录了：https://dshbase.com/plugins/dsh-content-search/",
              "",
              "在对话头部放一颗搜索按钮，右侧栏把整段会话里的命中摊开，关键词在你的消息和 AI 回复里都标黄，点一下就跳到那一句——全文索引关掉也照样能搜。纯本地、开箱即用，放在效率分类刚刚好。感谢分享给社区 🙌",
            ].join("\n");
            const marker = "https://dshbase.com/plugins/dsh-content-search/";

            const existing = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const already = existing.data.some((c) => (c.body || "").includes(marker));
            if (!already) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info("commented #275");
            } else {
              core.info("#275 already has the catalog note");
            }

            await github.rest.issues.update({
              owner,
              repo,
              issue_number,
              state: "closed",
              state_reason: "completed",
            });
            core.info("closed #275");
