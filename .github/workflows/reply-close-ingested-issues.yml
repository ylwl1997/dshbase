name: Reply and close ingested plugin issues

# One-shot: the cloud agent token cannot write issues. This workflow uses the
# repo GITHUB_TOKEN (issues: write) to post the catalog close-out and close
# Issues #192 and #193. Safe to delete after it succeeds.
on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close #192 and #193
        uses: actions/github-script@v7
        with:
          script: |
            const comments = {
              192: [
                "Thanks for shipping **dsh-DSTuber** — it’s live on dshbase as **Verified** 🎉",
                "",
                "Directory: https://dshbase.com/plugins/dsh-DSTuber/",
                "中文：https://dshbase.com/zh/plugins/dsh-DSTuber/",
                "",
                "Windows 桌面 Live2D 桌宠，看着 DSH 干活、碎碎念，还能把回答念出来，开箱即用，收录啦。Closing this Issue — 感谢投稿！",
              ].join("\n"),
              193: [
                "Thanks for shipping **dsh-plugin-market-internal** — it’s live on dshbase as **Verified** 🎉",
                "",
                "Directory: https://dshbase.com/plugins/dsh-plugin-market-internal/",
                "中文：https://dshbase.com/zh/plugins/dsh-plugin-market-internal/",
                "",
                "团队自托管插件市场：服务端管账号、权限和制品，DSH 客户端负责安装、更新与召回，收录啦。Closing this Issue — 感谢投稿！",
              ].join("\n"),
            };
            const { owner, repo } = context.repo;
            for (const [num, body] of Object.entries(comments)) {
              const issue_number = Number(num);
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                state: "closed",
                state_reason: "completed",
              });
              core.info(`closed #${issue_number}`);
            }
