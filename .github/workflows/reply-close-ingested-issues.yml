name: Reply and close ingested plugin issues

# One-shot: the cloud agent token cannot write issues. This workflow uses the
# repo GITHUB_TOKEN (issues: write) to post the catalog close-out for #287.
# Safe to delete after it succeeds. It does not touch #261, #250, #205, or #207.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/reply-close-ingested-issues.yml

permissions:
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Comment and close #287
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = 287;
            const body = [
              "感谢提交！**dsh-caption-balance** 已经收录进目录了：https://dshbase.com/plugins/dsh-caption-balance/",
              "",
              "太棒了。桌面端标题栏「应用 / 编辑」旁边就能看到账号余额、今日花费和当前峰谷时段：余额走官方账号服务，花费按本机会话日志估算。没有这排菜单的平台会退回会话标题栏，显示同款读数。开箱即用，放在界面与皮肤分类刚刚好。",
              "",
              "安装：`dsh plugin --profile desktop add github:resnowh/dsh-caption-balance`（目录版本 0.2.1，也可钉 `github:resnowh/dsh-caption-balance#v0.2.1`）。",
              "",
              "中文页：https://dshbase.com/zh/plugins/dsh-caption-balance/",
              "",
              "感谢分享给社区 🙌",
            ].join("\n");
            const marker = "https://dshbase.com/plugins/dsh-caption-balance/";

            const existing = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const already = existing.data.some((c) => (c.body || "").includes(marker));
            if (!already) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info("commented #287");
            } else {
              core.info("#287 already has the catalog note");
            }

            await github.rest.issues.update({
              owner,
              repo,
              issue_number,
              state: "closed",
              state_reason: "completed",
            });
            core.info("closed #287");
