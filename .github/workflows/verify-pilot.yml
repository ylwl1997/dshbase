# Pilot only. Runs real L1–L3 checks and uploads a report.
# Does not edit src/data/plugins.json and does not use CATALOG_REPO_TOKEN.
#
# workflow_dispatch appears in the Actions tab after this file is on the
# default branch. Until then, a push to cursor/dsh-verify-pilot-2277 that
# touches this workflow or scripts/verify-pilot.py starts a run.
name: Plugin verify pilot

on:
  workflow_dispatch:
    inputs:
      plugins:
        description: >-
          Optional plugin list. One per line: slug|install-spec
          Empty uses the built-in pilot set (dsh-plugin-observatory, dsh-sherlock,
          dsh-processing-status, vacum972-dsh-usage-billing,
          yumiku-dsh-commandcode-quota).
        required: false
        default: ''
        type: string
  push:
    branches:
      - cursor/dsh-verify-pilot-2277
    paths:
      - .github/workflows/verify-pilot.yml
      - scripts/verify-pilot.py
      - scripts/dsh_official_spec.py

permissions:
  contents: read
  actions: write

concurrency:
  group: verify-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Require Node >=24.9 <25
        run: |
          node -e 'const p=process.versions.node.split(".").map(Number); if(!(p[0]===24 && p[1]>=9)){console.error("need Node >=24.9 <25 for dsh-sherlock, got", process.version); process.exit(1)}'
          node --version

      - name: Install official dsh latest and pnpm
        run: |
          set -euo pipefail
          # Dist-tag latest. The resolved version is printed below and again
          # in the pilot report (dsh --version). Do not freeze a semver here.
          if ! npm install -g --allow-scripts=@deepseek-ai/dsh-subprocess-local,koffi,node-pty,@google/genai,protobufjs pnpm@10 @deepseek-ai/dsh@latest; then
            npm install -g pnpm@10 @deepseek-ai/dsh@latest
          fi
          pnpm --version
          npm view @deepseek-ai/dsh version
          dsh --version

      - name: Self-check report classifier
        run: python3 scripts/verify-pilot.py --self-check

      - name: Run L1–L3 pilot
        env:
          DSH_HOME: /tmp/dsh-pilot-home
          # Empty when the secret is not configured. The script records L3 as
          # needs-env instead of inventing a model answer.
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PILOT_PLUGINS: ${{ github.event.inputs.plugins }}
        run: python3 scripts/verify-pilot.py --out-dir pilot-report

      - name: Job summary
        if: always()
        run: |
          if [ -f pilot-report/summary.md ]; then
            cat pilot-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pilot report was not written." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-pilot-report
          path: |
            pilot-report/report.json
            pilot-report/summary.md
            pilot-report/logs/
          if-no-files-found: warn
